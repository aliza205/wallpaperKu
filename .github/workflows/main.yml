name: Build APK

# Berjalan otomatis setiap ada file yang diunggah, atau bisa dijalankan manual
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Jika yang diunggah berupa file .zip, ekstrak dulu lalu cari proyeknya
      - name: Siapkan proyek
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -q -o "$z" -d proyek
          done
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
